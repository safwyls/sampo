name: Release (companion)

# Publishes the Artificer Companion beside the docker images: every push
# to main rebuilds the exe and replaces the assets on the rolling
# `companion-latest` release, so the download link players hold keeps
# pointing at the current build (the reliquary image bundles the same
# exe for its token-gated download). Version tags additionally attach
# the exe to that tag's own release.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/companion/package-lock.json
      # The companion's page is embedded in the exe (web/companion), so
      # the frontend has to exist before the Go build runs.
      - name: Companion frontend build
        working-directory: web/companion
        run: |
          npm ci
          npm run build
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - name: Build the companion (Windows is what players run; linux for dev machines)
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -ldflags="-H windowsgui -X main.version=${GITHUB_SHA::12}" -o artificer-companion.exe ./cmd/companion
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -ldflags="-X main.version=${GITHUB_SHA::12}" -o artificer-companion-linux ./cmd/companion
      # What the installed companion compares itself against. Every build
      # here stamps main.version with a commit SHA — including tagged
      # ones — and SHAs have no order, so "is there something newer" can
      # only be answered by identity: this release says which build it
      # is, and a companion whose own stamp differs is not running it.
      # A file rather than a line in the release notes, because the
      # updater should read a fact, not parse prose.
      #
      # The checksums are what the updater verifies a download against
      # before it replaces a running binary. The exe is unsigned, so this
      # is not provenance — it catches a truncated or corrupted download,
      # which is the failure that would otherwise leave someone with an
      # unrunnable companion and no way back.
      - name: Version and checksum manifests
        run: |
          printf '%s' "${GITHUB_SHA::12}" > companion-version.txt
          sha256sum artificer-companion.exe artificer-companion-linux > companion-sha256.txt
          cat companion-version.txt companion-sha256.txt
      - name: Rolling companion-latest release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: companion-latest
          name: Artificer Companion (latest)
          body: |
            The Artificer Companion — the save-sync client that runs on a player's machine.
            Rebuilt from every push to main; the commit this build came from is ${{ github.sha }}.
            Windows players want `artificer-companion.exe`.
          prerelease: true
          files: |
            artificer-companion.exe
            artificer-companion-linux
            companion-version.txt
            companion-sha256.txt
      - name: Tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artificer-companion.exe
            artificer-companion-linux
            companion-version.txt
            companion-sha256.txt
